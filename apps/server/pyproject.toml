[project]
name = "ciws"
version = "0.1.0"
description = "CIWS - Cognitive Intelligence Workspace System. A local-first agentic intelligence hub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "numpy>=1.24",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "anyio>=4.2",
    "rich>=13.7",
    "typing-extensions>=4.10",
    # The Anthropic adapter uses the official SDK: this API surface moves
    # (adaptive thinking, effort, refusal stop reasons) and the SDK tracks it.
    "anthropic>=0.60",
]

[project.optional-dependencies]
ingest = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "pillow>=10.2",
]
local = [
    "sentence-transformers>=2.6",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
ciws = "ciws.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ciws"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
